<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script src="ads.js"></script>
<title>Büyük Yemin</title>
<meta name="theme-color" content="#141510">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Saira+Stencil+One&display=swap">
<style>
/* Layout: tek sütun mobil uygulama. Üstte durum çubuğu + ilerleme çizgisi, ortada kaydırılan ekran, altta yüzen sekme çubuğu.
   Renkler ülke seçimine göre JS ile değişir (--bg, --acc ...). Varsayılan: zeytin + bronz. */
:root{
  color-scheme:dark;
  --bg:#141510; --bg2:#191a14; --panel:#20211a; --panel2:#292a21; --line:#3a3b2e;
  --fg:#eeeadb; --muted:#a9a691; --dim:#78766a;
  --acc:#c9a64a; --acc2:#b8453a; --on-acc:#17150c;
  --red:#e0563c; --green:#7fb35a; --blue:#70a3c4; --amber:#e39540;
  --tex:none;
  --font-d:"Saira Stencil One", Impact, "Arial Black", sans-serif;
  --font-c:"Barlow Condensed", "Arial Narrow", sans-serif;
  --font-b:"Barlow", system-ui, -apple-system, sans-serif;
  --r:14px;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-b);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--acc) 9%,var(--bg)) 0%,var(--bg) 60%);}
#app::before{content:"";position:absolute;inset:0;background-image:var(--tex);background-size:420px;opacity:.55;pointer-events:none}
#app > *{position:relative}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.lbl{font:600 11.5px/1.2 var(--font-c);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--font-c);font-variant-numeric:tabular-nums}
.stencil{font-family:var(--font-d);letter-spacing:.02em}
.acc{color:var(--acc)} .red{color:var(--red)} .green{color:var(--green)} .muted{color:var(--muted)} .small{font-size:13px}

/* üst çubuk */
.top{flex:none;display:flex;align-items:center;gap:10px;padding-block:10px 9px;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:relative}
.top .face{width:42px;height:42px;border-radius:12px;overflow:hidden;flex:none;box-shadow:0 0 0 1px var(--line)}
.top .face svg{display:block;width:100%;height:100%}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font:700 17px/1.1 var(--font-c);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who span{font:600 12.5px/1.2 var(--font-c);color:var(--acc);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.top .day{text-align:right;flex:none}
.top .day b{display:flex;align-items:center;gap:6px;justify-content:flex-end;font:700 15px/1.1 var(--font-c)}
.pips{display:flex;gap:4px;justify-content:flex-end;margin-top:5px}
.pip{width:15px;height:5px;border-radius:3px;background:var(--line)}
.pip.on{background:var(--acc)}
.xpline{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}
.xpline i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}

.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:16px 108px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px}
.scr.plain{padding-bottom:28px}
.scr > *{flex-shrink:0}
.mg > *{flex-shrink:0}

/* yüzen menü */
.nav{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:6px;border-radius:20px;background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);box-shadow:0 12px 34px rgba(0,0,0,.45)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:14px;font:600 10.5px/1 var(--font-c);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);position:relative;transition:background .15s,color .15s}
.nav button svg{width:21px;height:21px}
.nav button.on{color:var(--on-acc);background:var(--acc)}
.nav .dot{position:absolute;top:5px;right:22%;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg2)}

/* kartlar */
.card{background:linear-gradient(180deg,color-mix(in srgb,var(--panel2) 70%,var(--panel)),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:11px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.card.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 14%,var(--panel2)),var(--panel) 70%)}
.card.hero::before,.card.hero::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--acc);opacity:.8}
.card.hero::before{top:8px;left:8px;border-right:0;border-bottom:0;border-top-left-radius:6px}
.card.hero::after{bottom:8px;right:8px;border-left:0;border-top:0;border-bottom-right-radius:6px}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h2{font:700 18px/1.1 var(--font-c);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec-h h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--acc)}
.sec-t{font:700 13px/1 var(--font-c);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;margin-top:6px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 12px/1.3 var(--font-c);letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor}

.bar{display:grid;grid-template-columns:100px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:7px;border-radius:4px;background:color-mix(in srgb,var(--bg) 80%,#000);position:relative;overflow:hidden}
.bar .t i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--acc)}
.bar .v{text-align:right;font:600 14px var(--font-c);font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;min-height:48px;border-radius:12px;background:var(--acc);color:var(--on-acc);font:700 15px/1 var(--font-c);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--acc);box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 25%,transparent)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:color-mix(in srgb,var(--panel2) 70%,transparent);color:var(--fg);border-color:var(--line);box-shadow:none}
.btn.warn{background:var(--red);border-color:var(--red);color:#fff;box-shadow:none}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.block{width:100%}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:color-mix(in srgb,var(--panel2) 85%,transparent);border:1px solid var(--line);border-radius:12px;padding:11px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:74px;position:relative}
.tile b{font:700 15px/1.15 var(--font-c);letter-spacing:.03em}
.tile small{font-size:12px;color:var(--muted);line-height:1.3}
.tile.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc),0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.tile[disabled]{opacity:.42}
.tile .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);margin-bottom:4px}
.tile .ico svg{width:20px;height:20px}
.lv{height:4px;border-radius:2px;background:color-mix(in srgb,var(--bg) 80%,#000);margin-top:auto;overflow:hidden}
.lv i{display:block;height:100%;background:var(--acc)}

.opt{display:flex;gap:12px;text-align:left;padding:14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);align-items:flex-start}
.opt .k{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--acc);color:var(--acc);font:700 16px var(--font-c)}
.opt:hover{border-color:var(--acc)}

.list{display:flex;flex-direction:column}
.list > div{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.list > div:last-child{border:0}

input[type=text],input[type=number],textarea{width:100%;background:color-mix(in srgb,var(--bg) 85%,#000);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:11px 12px;font:16px var(--font-b)}
textarea{min-height:170px;resize:vertical;line-height:1.55}
.field{display:flex;flex-direction:column;gap:7px}
input[type=range]{width:100%;accent-color:var(--acc)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week div{border:1px solid var(--line);border-radius:8px;padding:7px 0;text-align:center;font:600 11px var(--font-c);letter-spacing:.05em;color:var(--dim)}
.week div.done{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.week div.today{border-color:var(--fg);color:var(--fg)}

.req{display:flex;flex-direction:column;gap:5px;font-size:13px}
.req div{display:flex;justify-content:space-between;gap:8px}
.ok{color:var(--green)} .no{color:var(--muted)}

.banner{border:1px solid var(--red);border-radius:12px;background:color-mix(in srgb,var(--red) 14%,transparent);padding:10px 12px;font:600 14px/1.35 var(--font-c);letter-spacing:.04em}
.mapwrap{background:color-mix(in srgb,var(--bg) 85%,#000);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto}
.leg{display:grid;grid-template-columns:26px 1fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.leg .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mini{padding:7px 10px;border-radius:9px;font:700 12px/1 var(--font-c);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--fg);background:color-mix(in srgb,var(--panel2) 60%,transparent)}
.mini.b{border-color:var(--acc);color:var(--acc)}
.mini.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.mini.r{border-color:var(--red);color:var(--red)}
.mini[disabled]{opacity:.4}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.seg button{padding:9px 4px;border-radius:9px;font:600 12.5px var(--font-c);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--on-acc)}

table.ranks{width:100%;border-collapse:collapse;font-size:14px}
table.ranks td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.ranks td.c{font:600 12px var(--font-c);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding-top:14px}
table.ranks tr.cur td{color:var(--acc);font-weight:600}

/* başlık ekranı */
.title{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:18px;padding-block:24px 26px;position:relative;overflow:hidden}
.title canvas{position:absolute;inset:0;width:100%;height:100%}
.title > *:not(canvas){position:relative}
.logo{font:400 clamp(50px,16vw,80px)/.86 var(--font-d);color:var(--fg);text-shadow:0 4px 30px rgba(0,0,0,.6)}
.logo span{color:var(--acc)}
.tag{font:600 13px/1.45 var(--font-c);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);max-width:32ch}
.menu{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:16px;text-align:left;background:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line)}
.mrow .mi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);flex:none;overflow:hidden}
.mrow .mi svg{width:22px;height:22px}
.mrow b{display:block;font:700 18px/1.1 var(--font-c);letter-spacing:.06em;text-transform:uppercase}
.mrow small{color:var(--muted);font-size:13px}
.mrow .chev{margin-left:auto;color:var(--dim);font:700 22px var(--font-c)}
.mrow.primary{background:linear-gradient(120deg,var(--acc),color-mix(in srgb,var(--acc) 70%,var(--acc2)));border-color:transparent;color:var(--on-acc)}
.mrow.primary .mi{background:rgba(0,0,0,.18);color:var(--on-acc)}
.mrow.primary small,.mrow.primary .chev{color:color-mix(in srgb,var(--on-acc) 75%,transparent)}
.step{font:600 12px var(--font-c);letter-spacing:.2em;color:var(--acc);text-transform:uppercase}
.big-q{font:400 clamp(30px,9vw,42px)/1 var(--font-d)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(6,7,5,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90%;overflow:auto;background:linear-gradient(180deg,var(--panel2),var(--panel) 40%);border-top:3px solid var(--acc);border-radius:22px 22px 0 0;padding-top:20px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
.sheet h3{font:400 27px/1.05 var(--font-d)}
.sheet .body{display:flex;flex-direction:column;gap:10px;font-size:15px}
.sheet .art{display:flex;justify-content:center;border-radius:12px;overflow:hidden}
.quote{border-left:3px solid var(--acc);padding:4px 0 4px 12px;font-style:italic}
.quote.bad{border-color:var(--red)}
.fx{display:flex;flex-wrap:wrap;gap:6px}
.fx span{font:600 13px var(--font-c);padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.fx .p{color:var(--green)} .fx .n{color:var(--red)}
.sug{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.sug:last-child{border:0}
.sug .si{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font:700 14px var(--font-c)}
.sug .si.h{background:color-mix(in srgb,var(--red) 22%,transparent);color:var(--red)}
.sug .si.m{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber)}
.sug .si.l{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--acc)}
.sug b{display:block;font:700 15px/1.2 var(--font-c);letter-spacing:.03em}
.sug span{font-size:13px;color:var(--muted)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;font:600 14px/1.3 var(--font-c);letter-spacing:.03em;max-width:min(92vw,520px);box-shadow:0 8px 28px rgba(0,0,0,.45)}

/* yaşam */
.flag{display:inline-block;vertical-align:-2px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.45);flex:none}
.sw{width:34px;height:34px;border:2px solid var(--line);border-radius:50%}
.sw.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.pv{display:flex;gap:14px;align-items:center;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r);padding:12px;position:sticky;top:-16px;z-index:3}
.pv svg{border-radius:12px}
.meals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.meal{display:flex;flex-direction:column;text-align:left;border-radius:13px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);position:relative}
.meal svg{display:block;width:100%;height:auto}
.meal .mt{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.meal .mt b{font:700 14px/1.15 var(--font-c);letter-spacing:.02em}
.meal .mt small{font:600 12px var(--font-c);color:var(--muted);letter-spacing:.04em}
.meal .q{position:absolute;top:7px;right:7px;font:700 12px var(--font-c);padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.55)}
.meal.sel{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.meal.sel::after{content:"✓";position:absolute;top:7px;left:7px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font:700 13px var(--font-c)}

/* mini oyun */
#mg{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.mg{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px;padding-block:14px;overflow-y:auto}
.mg-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mg-top b{font:700 20px var(--font-c);letter-spacing:.04em}
.mg-hud{display:flex;justify-content:space-between;gap:8px;font:600 14px var(--font-c);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mg-hud b{color:var(--fg)}
.mg-stage{flex:1;min-height:220px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.mg-cmd{font:400 clamp(32px,10vw,50px)/1 var(--font-d);text-align:center}
.mg-cmd.g{color:var(--green)} .mg-cmd.r{color:var(--red)}
.mg-tbar{width:70%;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.mg-tbar i{display:block;height:100%;background:var(--acc);width:100%}
.mg-pad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mg-btn{min-height:68px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font:700 18px var(--font-c);letter-spacing:.06em;text-transform:uppercase;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.mg-btn:active{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.mg-btn.bad{background:var(--red);color:#fff}
.opp{transition:transform .12s}
.opp.hit{transform:translateX(14px) rotate(7deg)}
.track{width:88%;height:34px;border-radius:8px;background:var(--bg);border:1px solid var(--line);position:relative;overflow:hidden}
.track .z{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--green) 45%,transparent);border-left:2px solid var(--green);border-right:2px solid var(--green)}
.track .m{position:absolute;top:0;bottom:0;width:4px;background:var(--fg);margin-left:-2px}
.mg-canvas{display:block;width:100%;border-radius:var(--r);touch-action:none;background:#000}
.brief{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:color-mix(in srgb,var(--panel2) 80%,transparent);display:flex;gap:10px;align-items:flex-start}
.brief .n{font:400 22px/1 var(--font-d);color:var(--acc);flex:none;min-width:26px}
.brief b{font:700 16px/1.2 var(--font-c);letter-spacing:.03em;display:block}
.squad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sq{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative}
.sq svg{border-radius:12px;width:100%;height:auto}
.sq b{font:700 12.5px/1.1 var(--font-c);letter-spacing:.03em}
.sq .mb{width:100%;height:5px;border-radius:3px;background:var(--bg);overflow:hidden}
.sq .mb i{display:block;height:100%;background:var(--green);transition:width .5s}

.ttape{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:-24px;right:-24px;transform:rotate(-2.5deg);display:flex;justify-content:space-between;gap:10px;padding:7px 40px;background:linear-gradient(180deg,#d6c793,#bfae78);color:#2a2418;font:700 12px var(--font-c);letter-spacing:.22em;text-transform:uppercase;box-shadow:0 6px 16px rgba(0,0,0,.5);-webkit-mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ttape span:first-child{color:#8f1d1d}
.tpatch{position:absolute;top:calc(74px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:7px;border-radius:9px;background:#23251d;box-shadow:0 8px 18px rgba(0,0,0,.55),inset 0 0 0 1px #ffffff14;line-height:0}
.tpatch::after{content:"";position:absolute;inset:3px;border:1.5px dashed rgba(255,255,255,.28);border-radius:7px;pointer-events:none}
.tpatch svg{border-radius:3px}
.tags{position:absolute;top:calc(48px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:92px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6));transform-origin:50% 0;animation:swing 5s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.plate{position:relative;padding:18px 18px 14px;border-radius:14px;background:linear-gradient(160deg,rgba(60,64,52,.92),rgba(24,26,20,.95));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.4),0 22px 44px rgba(0,0,0,.6)}
.plate .lbl{color:#d6c793;letter-spacing:.24em}
.plate .rv{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f2f2ec,#7c7f78 55%,#3a3c37);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.plate .rv.a{top:9px;left:9px}.plate .rv.b{top:9px;right:9px}.plate .rv.c{bottom:9px;left:9px}.plate .rv.d{bottom:9px;right:9px}
.t2 .logo{color:#ece8db;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 30px rgba(0,0,0,.4);margin:6px 0 4px}
.t2 .logo span{background:linear-gradient(180deg,#fbeec0 0%,#e2c160 42%,#8f6a1e 52%,#e7cd7a 78%,#b8902e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.6))}
.stencilbar{display:flex;align-items:center;gap:10px;font:700 12px var(--font-c);letter-spacing:.3em;text-transform:uppercase;color:#cfc8ad}
.stencilbar span{flex:1;height:1px;background:linear-gradient(90deg,transparent,#cfc8ad80,transparent)}
.t2 .tag{color:#d9d4c2;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.t2 .mrow{background:linear-gradient(180deg,rgba(40,43,34,.9),rgba(20,22,17,.94));border:1px solid rgba(255,255,255,.12);border-left:4px solid var(--acc);box-shadow:0 10px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.t2 .mrow b{font-family:var(--font-c);letter-spacing:.08em;text-transform:uppercase}
.t2 .mrow.primary{background:repeating-linear-gradient(-45deg,rgba(0,0,0,.08) 0 10px,transparent 10px 20px),linear-gradient(120deg,var(--acc),color-mix(in srgb,var(--acc) 65%,#000));border-color:transparent;border-left:4px solid #d6c793}
.tempo{display:flex;flex-direction:column;gap:6px}
.tempo .seg button{padding:8px 4px}
.title.t2 > .ttape,.title.t2 > .tpatch,.title.t2 > .tags{position:absolute}
.ttape span{white-space:nowrap}
/* v10 · gün akışı */
.flow .fl{display:flex;flex-direction:column;gap:6px}
.fs{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 55%,transparent);color:var(--dim)}
.fs i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font:700 13px var(--font-c)}
.fs span{display:flex;flex-direction:column;flex:1;min-width:0}.fs b{font:700 15px var(--font-c);letter-spacing:.04em;color:var(--fg)}.fs small{font-size:12px;color:var(--muted)}
.fs em{font-style:normal;font:700 11px var(--font-c);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);flex:none}
.fs.ok{color:var(--green);opacity:.75}.fs.ok b{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--green) 60%,transparent)}
.fs.now{color:var(--acc);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 30%,transparent),0 8px 20px rgba(0,0,0,.3)}
.chips2{display:flex;justify-content:space-between;align-items:center;font:600 13px var(--font-c);letter-spacing:.06em;padding:6px 2px;border-top:1px dashed var(--line)}
.promo{display:flex;flex-direction:column;gap:5px}
.pb{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2,var(--acc)),var(--acc));transition:width .6s}
.pb.lv i{background:linear-gradient(90deg,#3f86e8,#7fd1ff)}
.lockn{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:9px 10px;margin-top:6px}
.tpatch.star{padding:8px}
/* taktik ekran */
.tac{position:relative;border-radius:12px;overflow:hidden;border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.tac svg{display:block;width:100%;height:auto}
.tac.nvg svg{filter:sepia(1) hue-rotate(55deg) saturate(2.2) brightness(.95)}
.tac .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);animation:scan8 6s linear infinite}
@keyframes scan8{from{background-position:0 0}to{background-position:0 190px}}
.tracer{animation:trc .9s linear infinite}@keyframes trc{from{stroke-dashoffset:46}to{stroke-dashoffset:0}}
.pchips{margin-top:8px}.pchips div{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.pchips em{font-style:normal;font:600 11px var(--font-c);letter-spacing:.04em;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pchips em.p{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}.pchips em.n{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
/* sinematik */
.opin{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 45%,color-mix(in srgb,var(--acc) 22%,#060805),#030402);display:grid;place-items:center;color:#fff;overflow:hidden}
.opin .oi-scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 1px,transparent 1px 4px);animation:scan8 3s linear infinite}
.oi-c{position:relative;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:24px}
.oi-c .lbl{color:#d6c793;letter-spacing:.3em}
.oi-code{font:400 clamp(28px,9vw,40px)/1 var(--font-d);letter-spacing:.12em;color:#ddd;animation:inew .8s ease both}
.oi-code b{display:block;font-size:1.5em;color:var(--acc);text-shadow:0 0 30px color-mix(in srgb,var(--acc) 60%,transparent)}
.oi-ti{font:600 15px var(--font-c);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.oi-cd{font:700 86px/1 var(--font-c);color:#fff;text-shadow:0 0 40px var(--acc);min-height:90px}
.oi-cd.pop{animation:cdpop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cdpop{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
.beat{position:absolute;inset:0;background:rgba(4,5,3,.86);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px max(18px,env(safe-area-inset-left,0px));color:#fff}
.bt-band{padding:16px 18px;transform:skewY(-3deg);animation:band8 .45s cubic-bezier(.2,1.3,.4,1) both}
.bt-band span{display:block;font:600 12px var(--font-c);letter-spacing:.3em;text-transform:uppercase;opacity:.85}
.bt-band b{display:block;font:700 clamp(26px,8vw,36px)/1.05 var(--font-c);letter-spacing:.06em}
.beat.g .bt-band{background:linear-gradient(90deg,#1f7a45,#2fae62)}.beat.m .bt-band{background:linear-gradient(90deg,#9a6a12,#d39b2a)}.beat.b .bt-band{background:linear-gradient(90deg,#7a1414,#c8302a);animation:band8 .45s cubic-bezier(.2,1.3,.4,1) both,shake8 .4s .45s}
@keyframes band8{from{transform:skewY(-3deg) translateX(-110%)}to{transform:skewY(-3deg)}}
@keyframes shake8{0%,100%{translate:0}25%{translate:-8px}50%{translate:7px}75%{translate:-4px}}
.bt-radio{border-left:3px solid #ffffff55;padding:4px 0 4px 14px;animation:fxin .5s .35s both}
.bt-radio .tm{font:600 12px var(--font-c);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.bt-radio p{margin:6px 0 8px;font-size:17px;line-height:1.45}
.bt-radio .dl{display:flex;flex-wrap:wrap;gap:6px}.bt-radio .dl em{font-style:normal;font:600 12px var(--font-c);padding:2px 8px;border-radius:999px;border:1px solid #ffffff40}
.bt-radio .dl em.n{color:#ff8a7a}.bt-radio .dl em.p{color:#8cf0a8}
.bt-tap{font:600 11px var(--font-c);letter-spacing:.2em;text-transform:uppercase;opacity:.5;text-align:center;animation:fxin .5s 1s both}
/* v11 */
.lvup{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(70% 55% at 50% 45%,color-mix(in srgb,var(--acc) 30%,#070806),#030402);color:#fff;text-align:center}
.lu-c{display:flex;flex-direction:column;gap:12px;align-items:center;padding:24px}
.lu-c .lbl{color:#d6c793;letter-spacing:.3em}
.lu-n{font:700 30px/1 var(--font-c);letter-spacing:.2em;animation:cdpop .6s cubic-bezier(.2,1.4,.4,1) both}
.lu-n b{display:block;font-size:96px;line-height:1;color:var(--acc);text-shadow:0 0 40px color-mix(in srgb,var(--acc) 70%,transparent)}
.lu-belt{font:700 18px var(--font-c);letter-spacing:.12em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:linear-gradient(90deg,#8f6a1e,#e2c160,#8f6a1e);color:#1b1607;animation:fxin .5s .3s both}
.lu-belt.dim{background:#ffffff1a;color:#ddd}
.lu-t{font-size:16px;animation:fxin .5s .5s both}
.abil{display:flex;flex-direction:column;gap:6px}
.abr{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px}
.ab{flex:none;width:118px;display:flex;flex-direction:column;gap:3px;text-align:left;padding:9px;border-radius:12px;border:1px solid color-mix(in srgb,var(--acc) 55%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 18%,var(--panel2)),var(--panel));box-shadow:0 6px 16px rgba(0,0,0,.3)}
.ab .ai{font-size:20px;line-height:1}.ab b{font:700 14px/1.1 var(--font-c);letter-spacing:.03em}.ab small{font-size:11px;line-height:1.25;color:var(--muted)}
.ab.lock,.ab.used{opacity:.42;border-color:var(--line);background:var(--panel2);box-shadow:none}
.tag.pc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.abfx{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;background:radial-gradient(60% 45% at 50% 50%,rgba(255,170,60,.35),rgba(5,5,3,.92));color:#fff;text-align:center}
.af-i{font-size:84px;animation:cdpop .5s cubic-bezier(.2,1.4,.4,1) both}
.af-t{font:700 clamp(24px,7vw,34px) var(--font-c);letter-spacing:.12em;animation:band8 .4s .15s both;transform:skewY(-3deg);background:linear-gradient(90deg,#9a3a12,#e07a2a);padding:10px 18px}
.eras{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.eras div{border:1px solid var(--line);border-radius:9px;padding:6px 5px;display:flex;flex-direction:column;gap:2px;color:var(--dim);min-width:0}
.eras b{font:700 11.5px/1.1 var(--font-c);letter-spacing:.02em}.eras small{font-size:10px;line-height:1.15;overflow-wrap:anywhere}
.eras .ok{color:var(--green)}.eras .now{color:var(--acc);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
/* v13 · premium kutucuklar */
.sheet{flex-shrink:0;background:radial-gradient(120% 50% at 50% 0%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px),linear-gradient(180deg,#1f2119,#121410 60%);border-top:0;border-radius:24px 24px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.6),inset 0 1px 0 color-mix(in srgb,var(--acc) 60%,transparent);position:relative;padding-top:10px;gap:14px}
.sheet > *{flex-shrink:0}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:24px 24px 0 0;background:linear-gradient(90deg,transparent,var(--acc) 20%,color-mix(in srgb,var(--acc) 60%,#fff) 50%,var(--acc) 80%,transparent)}
.sh-grip{width:44px;height:5px;border-radius:3px;background:#ffffff26;align-self:center;margin-bottom:2px}
.sh-head{display:flex;flex-direction:column;gap:8px;padding-bottom:10px;border-bottom:1px solid #ffffff12;position:relative}
.sh-head::after{content:"";position:absolute;left:0;bottom:-1px;width:64px;height:2px;background:var(--acc)}
.sh-k{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;font:700 11px/1 var(--font-c);letter-spacing:.2em;text-transform:uppercase;color:var(--acc);padding:6px 10px;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);border-radius:6px;background:color-mix(in srgb,var(--acc) 10%,transparent)}
.sh-k i{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:pulse8 1.2s ease-in-out infinite alternate}
.sheet h3{font:400 clamp(24px,7vw,30px)/1.05 var(--font-d);letter-spacing:.02em;color:#f1ecdc;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.sheet .body{font-size:15.5px;line-height:1.55;color:#e4dfcd}
.sheet .art{overflow:visible;border-radius:14px}
.sh-ch{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.mch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:12px;border:1px solid #ffffff1c;background:linear-gradient(180deg,#2a2d23,#1d1f18);box-shadow:inset 0 1px 0 #ffffff10,0 6px 14px rgba(0,0,0,.35);transition:transform .12s,border-color .12s}
.mch:active{transform:scale(.985)}.mch:hover{border-color:color-mix(in srgb,var(--acc) 60%,transparent)}
.mch .mk{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:700 14px var(--font-c);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);background:#00000040}
.mch .mt{flex:1;font:700 15px/1.25 var(--font-c);letter-spacing:.04em;color:#f1ecdc}
.mch .mv{flex:none;font:700 20px var(--font-c);color:var(--acc)}
.mch.pri{border-color:transparent;background:linear-gradient(120deg,var(--acc),color-mix(in srgb,var(--acc) 70%,#000));box-shadow:0 10px 24px color-mix(in srgb,var(--acc) 30%,transparent),inset 0 1px 0 #ffffff40}
.mch.pri .mt,.mch.pri .mv{color:var(--on-acc)}.mch.pri .mk{color:var(--on-acc);border-color:#00000040;background:#00000022}
.speech{background:linear-gradient(180deg,#232619,#16180f);color:#efe9d6;border:1px solid color-mix(in srgb,var(--acc) 35%,#ffffff14);border-left:3px solid var(--acc);border-radius:4px 14px 14px 14px;padding:13px 15px;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.speech::before{border-right-color:var(--acc);left:-9px}
.speech p{font-size:15px;line-height:1.5}
.quote{background:#00000030;border-radius:0 10px 10px 0;padding:8px 12px;color:#d8d2bf}
#toast{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#262920,#16180f);color:#efe9d6;border:1px solid color-mix(in srgb,var(--acc) 40%,#ffffff14);padding:11px 14px 11px 12px;box-shadow:0 14px 34px rgba(0,0,0,.55);animation:up .25s ease-out}
#toast i{flex:none;width:4px;align-self:stretch;border-radius:2px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
/* sonuç kartı ek parçalar */
.bt-top{display:flex;align-items:center;gap:10px;font:600 12px var(--font-c);letter-spacing:.2em;text-transform:uppercase;opacity:.9}
.bt-ico{display:grid;place-items:center}.beat.g .bt-ico{color:#5fe08a}.beat.m .bt-ico{color:#f0c050}.beat.b .bt-ico{color:#ff6a5a}
.streak{font-style:normal;margin-left:auto;padding:3px 9px;border-radius:999px;background:linear-gradient(90deg,#e2c160,#fbeec0);color:#1b1607;font:700 12px var(--font-c);letter-spacing:.14em;animation:cdpop .5s both}
.bt-band b{font:700 clamp(28px,9vw,40px)/1.02 var(--font-c);letter-spacing:.05em}
.bt-band span{display:block;margin-top:6px;font:500 14px/1.35 var(--font-b);letter-spacing:0;text-transform:none;opacity:.92}
.bt-order{border:1px solid #ffffff22;border-radius:10px;padding:9px 12px;background:#ffffff08;animation:fxin .5s .25s both}
.bt-order span{font:600 11px var(--font-c);letter-spacing:.2em;text-transform:uppercase;opacity:.6}.bt-order p{margin:3px 0 0;font-size:15px}
/* devlet */
.gl{display:flex;flex-direction:column;gap:6px}
.gl > div{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);color:var(--dim)}
.gl i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font:700 13px var(--font-c)}
.gl span{display:flex;flex-direction:column}.gl b{font:700 15px var(--font-c);letter-spacing:.03em}.gl small{font-size:11.5px;color:var(--muted)}
.gl .ok{color:var(--green)}.gl .now{color:#e2c160;border-color:#e2c160;background:linear-gradient(90deg,#e2c16018,transparent)}
.card.dos{padding:0;overflow:hidden;gap:0}.card.dos .dz-top{align-items:center}
/* v14 · reklam */
.rwb{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 13px;border-radius:12px;border:1px solid color-mix(in srgb,#e2c160 55%,transparent);background:linear-gradient(120deg,#3a3220,#1f1b10);box-shadow:inset 0 1px 0 #ffffff14,0 6px 16px rgba(0,0,0,.35);color:#f3ead0;margin:4px 0}
.rwb .rwi{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#fbeec0,#c9a24a);color:#1b1607;font:700 13px var(--font-c)}
.rwb .rwt{display:flex;flex-direction:column}.rwb b{font:700 15px var(--font-c);letter-spacing:.04em}.rwb small{font-size:11.5px;color:#d6c793;opacity:.85}
.rwb[disabled]{opacity:.45;filter:grayscale(.6)}
.beat .rwb{margin-top:4px;animation:fxin .5s .6s both}
.card.adc{border-color:color-mix(in srgb,#e2c160 45%,var(--line))}
#adx{position:fixed;inset:0;z-index:120}
.adx{position:absolute;inset:0;background:#050604;color:#fff;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
.adx-top{display:flex;justify-content:space-between;font:700 12px var(--font-c);letter-spacing:.2em;opacity:.7}
.adx-top span:last-child{width:28px;height:28px;border-radius:50%;border:1px solid #ffffff55;display:grid;place-items:center;letter-spacing:0}
.adx-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.adx-box{width:min(320px,90%);aspect-ratio:9/12;border:1px dashed #ffffff40;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#ccc;padding:20px}
.adx-box b{font:700 20px var(--font-c);letter-spacing:.1em}
.adx-x{align-self:center;min-width:200px;padding:12px 18px;border-radius:12px;background:#fff;color:#111;font:700 15px var(--font-c);letter-spacing:.08em}
.adx-x[disabled]{opacity:.35}
/* v15 · varlıklar */
.wallet .wl-m{font:700 34px/1 var(--font-c);letter-spacing:.02em;margin:4px 0}
.wl-s{font-size:18px;color:#e2c160;letter-spacing:2px}.wl-s span{opacity:.25}
.vseg{overflow-x:auto}.vseg button{white-space:nowrap;padding:9px 8px}
.card.vcard{padding:0;overflow:hidden;gap:0}
.vart{display:block;width:100%;height:auto;aspect-ratio:320/150}
.vc-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px}

.t-giz{color:#8fb0d0}.t-atk{color:#ff8a6a}.t-hiz{color:#e2c160}.t-yavas{color:#9fc38a}.t-risk,.t-sivil{color:#f0a040}

.q-k{font:700 34px var(--font-c);letter-spacing:.2em;color:#ff6a4a;text-shadow:0 0 30px #ff3a1a;animation:cdpop .4s both}

.q-r{font:700 22px var(--font-c);letter-spacing:.1em;min-height:28px}.q-r.p{color:#e2c160}.q-r.g{color:#5fe08a}.q-r.b{color:#ff6a5a}
.qte.end.p,.qte.end.g{background:radial-gradient(70% 50% at 50% 50%,rgba(40,140,70,.4),rgba(4,4,3,.94))}
.outro{position:absolute;inset:0;display:grid;place-items:center;color:#fff;overflow:hidden;background:radial-gradient(80% 60% at 50% 40%,#2a2a1c,#040403)}
.outro.g{background:radial-gradient(80% 60% at 50% 40%,#16371f,#030403)}.outro.b{background:radial-gradient(80% 60% at 50% 40%,#3a1210,#040303)}
.ou-scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.04) 0 1px,transparent 1px 4px);animation:scan8 3s linear infinite}

.outro.g .ou-stamp{color:#5fe08a}.outro.m .ou-stamp{color:#f0c050}.outro.b .ou-stamp{color:#ff6a5a}
.ou-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(340px,100%);animation:fxin .5s .4s both}
.ou-grid div{border:1px solid #ffffff22;border-radius:12px;padding:10px;background:#ffffff08}
.ou-grid b{display:block;font:700 34px/1 var(--font-c)}.ou-grid span{font:600 11px var(--font-c);letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.ou-med{display:flex;gap:14px;justify-content:center;animation:fxin .5s 1.2s both}
.ou-med div{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:150px}.ou-med b{font:700 13px var(--font-c);color:#e2c160}.ou-med small{font-size:11px;opacity:.7}
.ou-chain{font:600 14px var(--font-c);letter-spacing:.06em;padding:8px 12px;border-radius:10px;border:1px solid #e0a04066;color:#f0c070;animation:fxin .5s 1.4s both}
.mrk{display:flex;gap:10px;flex-wrap:wrap}.mrk div{display:flex;flex-direction:column;align-items:center;gap:3px;width:92px;text-align:center}.mrk b{font:700 11.5px/1.15 var(--font-c);color:#e2c160}.mrk small{font-size:11px;color:var(--muted)}
.qte{background:radial-gradient(60% 40% at 50% 45%,#3a0f0a,#050403 75%)}.qte.end.p,.qte.end.g{background:radial-gradient(60% 40% at 50% 45%,#0f3a1c,#030403 75%)}.ou-stamp{font-size:clamp(26px,8vw,38px);white-space:nowrap}
/* v17 · alışveriş */
.shopg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.card.sitem.own{border-color:color-mix(in srgb,var(--green) 55%,var(--line))}
/* v18 · premium hazırlık */
.prep-h{display:flex;align-items:center;gap:10px;margin-top:6px}
.prep-h span{width:26px;height:26px;display:grid;place-items:center;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:var(--acc);color:var(--on-acc);font:700 13px var(--font-c)}
.prep-h b{font:700 15px var(--font-c);letter-spacing:.18em;text-transform:uppercase}.prep-h i{flex:1;height:1px;background:linear-gradient(90deg,var(--acc),transparent)}
.tgrid{display:flex;flex-direction:column;gap:9px}
.tcard{position:relative;display:flex;gap:12px;align-items:stretch;text-align:left;padding:13px 13px 13px 12px;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(135deg,#ffffff05 0 6px,transparent 6px 12px),linear-gradient(160deg,#272a20,#16180f);border:1px solid #ffffff17;box-shadow:0 10px 22px rgba(0,0,0,.35),inset 0 1px 0 #ffffff10;transition:transform .15s,border-color .15s,box-shadow .15s}
.tcard:active{transform:scale(.985)}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#ffffff22}
.tc-ic{flex:none;width:52px;border-radius:10px;display:grid;place-items:center;color:var(--acc);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--acc) 28%,transparent),#00000040);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent)}
.tc-b{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.tc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tc-h b{font:700 17px var(--font-c);letter-spacing:.04em}.tc-h em{font-style:normal;font:700 10px var(--font-c);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.tcard small{font-size:12.5px;color:var(--muted);line-height:1.3}

.tc-bars span{display:flex;flex-direction:column;gap:2px}.tc-bars i{font-style:normal;font:600 10px var(--font-c);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tc-bars u{display:block;height:4px;border-radius:2px;background:#ffffff14;overflow:hidden;text-decoration:none}.tc-bars s{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 60%,#fff),var(--acc));text-decoration:none}
.tc-ck{flex:none;align-self:center;width:28px;height:28px;border-radius:50%;border:1.5px solid #ffffff30;display:grid;place-items:center;font:700 15px var(--font-c);color:var(--on-acc)}
.tcard.sel{border-color:var(--acc);background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 60%),linear-gradient(160deg,#2c2f24,#16180f);box-shadow:0 0 0 1px var(--acc),0 0 28px color-mix(in srgb,var(--acc) 30%,transparent),0 12px 26px rgba(0,0,0,.45)}
.tcard.sel::before{background:var(--acc);box-shadow:0 0 12px var(--acc)}.tcard.sel .tc-ck{background:var(--acc);border-color:var(--acc)}.tcard.sel .tc-ic{color:#fff;background:radial-gradient(circle at 50% 35%,var(--acc),color-mix(in srgb,var(--acc) 30%,#000))}
.prep-go{display:flex;flex-direction:column;gap:5px;padding:12px 14px;border-radius:12px;border:1px dashed var(--line);margin-top:4px}
.prep-go span{font:700 14px var(--font-c);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.prep-go small{font-size:12px;color:var(--dim)}
.prep-go.ready{border-style:solid;border-color:var(--acc)}.prep-go.ready span{color:var(--acc)}
/* v19 · planlar */
.plans .pl{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(160deg,#25281f,#16180f)}
.plans .pl + .pl{margin-top:2px}
.pl-d{flex:none;width:58px;text-align:center;border-right:1px solid var(--line);padding-right:10px}.pl-d b{display:block;font:700 13px var(--font-c);letter-spacing:.12em;color:var(--acc)}.pl-d small{font-size:11px;color:var(--muted)}
.pl b{font:700 15px var(--font-c)}.pl.now{border-color:var(--green);box-shadow:0 0 0 1px color-mix(in srgb,var(--green) 40%,transparent)}
.btn.brk{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line));margin-top:4px}

/* ================= v22 · PREMIUM KATMAN ================= */
:root{--hair:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 40%,rgba(0,0,0,.4));--ease:cubic-bezier(.2,.8,.2,1)}
/* Birincil buton: metalik, kabartmalı, parıltılı */
.btn{position:relative;overflow:hidden;isolation:isolate;border:1px solid color-mix(in srgb,var(--acc) 60%,#000);border-radius:14px;min-height:50px;
 background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 72%,#fff) 0%,var(--acc) 38%,color-mix(in srgb,var(--acc) 70%,#000) 100%);
 box-shadow:0 1px 0 rgba(255,255,255,.08),0 10px 24px -6px color-mix(in srgb,var(--acc) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.25);
 text-shadow:0 1px 0 rgba(255,255,255,.25);transition:transform .15s var(--ease),box-shadow .2s,filter .2s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);transform:translateX(-120%);animation:sheen22 4.5s ease-in-out infinite}
@keyframes sheen22{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px) scale(.985);box-shadow:0 4px 12px -4px color-mix(in srgb,var(--acc) 50%,transparent),inset 0 2px 6px rgba(0,0,0,.3)}
.btn.ghost{color:var(--fg);text-shadow:none;border:1px solid transparent;
 background:linear-gradient(180deg,color-mix(in srgb,var(--panel2) 92%,#fff 3%),color-mix(in srgb,var(--panel) 96%,#000)) padding-box,linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 50%,color-mix(in srgb,var(--acc) 35%,transparent)) border-box;
 box-shadow:0 8px 20px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07)}
.btn.ghost::before{background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.08) 50%,transparent 60%)}
.btn.warn{border-color:#7a2414;background:linear-gradient(180deg,#f2876a 0%,var(--red) 40%,#a5321e 100%);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);box-shadow:0 10px 24px -8px rgba(224,86,60,.6),inset 0 1px 0 rgba(255,255,255,.4)}
.btn[disabled]{filter:grayscale(.6);opacity:.45;box-shadow:none}
.btn[disabled]::before{display:none}

/* Mini butonlar: ince altın hat */
.mini{border:1px solid transparent;border-radius:10px;padding:8px 12px;letter-spacing:.1em;
 background:linear-gradient(180deg,#2c2f25,#1b1d17) padding-box,linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.04)) border-box;box-shadow:0 4px 10px -4px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .12s var(--ease),filter .15s}
.mini:active{transform:scale(.96)}
.mini.b{color:color-mix(in srgb,var(--acc) 85%,#fff);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 16%,#24261e),#1a1c16) padding-box,linear-gradient(180deg,color-mix(in srgb,var(--acc) 85%,#fff),color-mix(in srgb,var(--acc) 30%,transparent)) border-box}
.mini.on{color:var(--on-acc);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 75%,#fff),var(--acc) 50%,color-mix(in srgb,var(--acc) 75%,#000)) padding-box,linear-gradient(180deg,#fff8,#0005) border-box}
.mini.r{color:#ff9a85;background:linear-gradient(180deg,#3a1f1a,#1d1513) padding-box,linear-gradient(180deg,#ff8a70,#e0563c40) border-box}

/* Segment kontrol: gömme ray + parlak hap */
.seg{border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:4px;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.25));box-shadow:inset 0 2px 6px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.05)}
.seg button{border-radius:10px;transition:color .2s,background .2s,box-shadow .2s;letter-spacing:.08em}
.seg button.on{color:var(--on-acc);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 70%,#fff),var(--acc) 45%,color-mix(in srgb,var(--acc) 78%,#000));box-shadow:0 4px 12px -2px color-mix(in srgb,var(--acc) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}

/* Kartlar: üst ışık hattı + derinlik */
.card{border-color:rgba(255,255,255,.07);box-shadow:0 14px 30px -12px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.03),inset 0 1px 0 rgba(255,255,255,.06)}
.card::selection{background:var(--acc)}
.sec-t{display:flex;align-items:center;gap:10px}
.sec-t::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 45%,transparent),transparent)}

/* Kutucuklar (eğitim vb.) */
.tile{border:1px solid transparent;border-radius:14px;background:linear-gradient(165deg,#2a2d23,#1a1c16) padding-box,linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 50%,rgba(0,0,0,.3)) border-box;box-shadow:0 10px 22px -12px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .15s var(--ease),box-shadow .2s}
.tile:active{transform:scale(.985)}
.tile .ico{background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--acc) 40%,transparent),color-mix(in srgb,var(--acc) 10%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 1px color-mix(in srgb,var(--acc) 35%,transparent)}
.tile.sel{background:linear-gradient(165deg,color-mix(in srgb,var(--acc) 18%,#2a2d23),#1a1c16) padding-box,linear-gradient(180deg,color-mix(in srgb,var(--acc) 90%,#fff),color-mix(in srgb,var(--acc) 30%,transparent)) border-box;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent),0 12px 24px -10px color-mix(in srgb,var(--acc) 40%,transparent)}

/* Harekât seçenekleri: dosya kartı, madalyon harf, altın kenar */
.opt.op2{border:1px solid transparent;border-left:0;border-radius:16px;padding:16px 16px 15px 14px;gap:14px;
 background:linear-gradient(160deg,#2a2d22 0%,#1d1f18 55%,#16170f 100%) padding-box,linear-gradient(170deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 35%,color-mix(in srgb,var(--acc) 40%,transparent)) border-box;
 box-shadow:0 14px 28px -14px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .16s var(--ease),box-shadow .2s}
.opt.op2::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 90%,#fff),color-mix(in srgb,var(--acc) 40%,transparent))}
.opt.op2:hover{box-shadow:0 18px 34px -14px rgba(0,0,0,.9),0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.08)}
.opt.op2:active{transform:scale(.988)}
.opt.op2 .k{width:36px;height:36px;font:700 17px var(--font-c);color:var(--on-acc);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 70%,#fff),var(--acc) 50%,color-mix(in srgb,var(--acc) 70%,#000));filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.opt.op2 .grow{display:flex;flex-wrap:wrap;align-items:center;column-gap:6px;row-gap:6px;font-weight:500;color:#efe9d6}
.opt.op2 .grow>.tag,.opt.op2 .grow>.tch{margin-top:2px}
.opt.op2 .tag{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.1)}
.auth{flex-basis:100%;display:inline-flex;align-items:center;gap:5px;width:max-content;max-width:100%;padding:3px 9px 3px 7px;border-radius:999px;font:700 10.5px/1.2 var(--font-c);letter-spacing:.14em;text-transform:uppercase;color:#f3d98a;background:linear-gradient(90deg,rgba(201,166,74,.28),rgba(201,166,74,.06));border:1px solid rgba(243,217,138,.35)}
.auth svg{width:11px;height:11px}
.opt.op2:has(.auth){background:linear-gradient(160deg,#2f2b1d 0%,#1f1d15 55%,#16150e 100%) padding-box,linear-gradient(170deg,rgba(243,217,138,.55),rgba(255,255,255,.05) 40%,rgba(243,217,138,.35)) border-box}

/* Komuta sorumluluğu şeridi */
.resp{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid transparent;
 background:linear-gradient(120deg,rgba(201,166,74,.14),rgba(0,0,0,.25)) padding-box,linear-gradient(90deg,rgba(243,217,138,.5),rgba(255,255,255,.06)) border-box}
.resp-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.resp-l .lbl{font:600 10.5px var(--font-c);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.resp-l b{font:700 17px/1.1 var(--font-c);letter-spacing:.04em;color:#f3d98a}
.resp-l small,.resp-r small{font-size:12px;color:var(--muted);line-height:1.3}
.resp-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.pips{display:flex;gap:4px}
.pips i{width:14px;height:6px;border-radius:2px;background:rgba(255,255,255,.1);transform:skewX(-20deg)}
.pips i.on{background:linear-gradient(90deg,#f3d98a,#c9a64a);box-shadow:0 0 8px rgba(243,217,138,.5)}

/* Alt menü: cam + altın hap */
.nav{border:1px solid transparent;background:linear-gradient(180deg,color-mix(in srgb,var(--bg2) 80%,transparent),color-mix(in srgb,var(--bg) 92%,transparent)) padding-box,linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.03)) border-box;
 box-shadow:0 18px 40px -10px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}

 const q=pick(OPQ),sw=R()<.5;const me=S.nation;

  const atk=pwr(me)+allies.reduce((s,a)=>s+pwr(a)*.5,0)+(g?18:-18)+S.st.strat/4+(S.st.mental-50)/5;
  const defA=NK.filter(a=>a!==k&&allied(a,k)&&a!==me);const def=pwr(k)*1.1+defA.reduce((s,a)=>s+pwr(a)*.35,0);

  else{S.world.p[me]-=5;S.trust=clamp(S.trust-12);addSt('mental',-10);const n=transfer(me,k,1);news(`${NAT[k].n}, harekâtımızı püskürttü.`);log(NAT[k].n+' harekâtı: yenilgi.');

  if(!S.world.war){S.world.war=k;S.world.warW=0}

 };

}

/* projeksiyon: eşdikdörtgen + cos(orta enlem), ülkeye sığdırılmış */
function projFor(k,W=340,H=250,pad=18){
 const pts=OUT[k].flat();let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;pts.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
 const c=Math.cos((y0+y1)/2*Math.PI/180);const sw=(x1-x0)*c,sh=y1-y0;const s=Math.min((W-pad*2)/sw,(H-pad*2)/sh);
 const ox=(W-sw*s)/2,oy=(H-sh*s)/2;
 const f=(lon,lat)=>[ox+(lon-x0)*c*s,oy+(y1-lat)*s];
 f.inv=(x,y)=>[(x-ox)/(c*s)+x0,y1-(y-oy)/s];f.W=W;f.H=H;f.b=[x0,x1,y0,y1];return f;
}
function smoothPath(pts){const n=pts.length;let d='';for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];d+=(i?'Q'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' ':'M'+m[0].toFixed(1)+' '+m[1].toFixed(1)+' ')+(i?m[0].toFixed(1)+' '+m[1].toFixed(1)+' ':'')}const a=pts[0];return d+'Q'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' '+((a[0]+pts[1][0])/2).toFixed(1)+' '+((a[1]+pts[1][1])/2).toFixed(1)+'Z'}
function hav(a,b){const R=6371,t=Math.PI/180;const dl=(b[0]-a[0])*t,dp=(b[1]-a[1])*t;const x=Math.sin(dp/2)**2+Math.cos(a[1]*t)*Math.cos(b[1]*t)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
/* kurmay haritası SVG'si */
function nationMap(k,f,extra=''){
 const W=f.W,H=f.H,[x0,x1,y0,y1]=f.b;const acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#c9a64a';
 let g='';const st=(x1-x0)>40?10:(x1-x0)>12?2:1;
 for(let lo=Math.ceil(x0/st)*st;lo<=x1;lo+=st){const a=f(lo,y0-5),b=f(lo,y1+5);g+=`<path d="M${a[0].toFixed(1)} 0V${H}" stroke="#ffffff10"/><text x="${a[0]+2}" y="${H-4}" font-size="7" fill="#ffffff40" font-family="Barlow Condensed,sans-serif">${lo}°${lo<0?'B':'D'}</text>`}
 const sty=(y1-y0)>20?10:(y1-y0)>6?2:1;
 for(let la=Math.ceil(y0/sty)*sty;la<=y1;la+=sty){const a=f(x0,la);g+=`<path d="M0 ${a[1].toFixed(1)}H${W}" stroke="#ffffff10"/><text x="3" y="${a[1]-2}" font-size="7" fill="#ffffff40" font-family="Barlow Condensed,sans-serif">${la}°K</text>`}
 if(typeof isFict==='function'&&isFict(k))g=g.replace(/<text[^>]*>[^<]*<\/text>/g,'');
 const land=OUT[k].map(r=>smoothPath(r.map(([a,b])=>f(a,b)))).join(' ');
 // ölçek çubuğu
 const midLat=(y0+y1)/2;const kmPerPx=hav(f.inv(0,H/2),f.inv(100,H/2))/100;let km=[50,100,200,500,1000,2000].find(v=>v/kmPerPx>50)||2000;const bl=km/kmPerPx;
 return `<svg viewBox="0 0 ${W} ${H}" class="tmap" role="img" aria-label="${NAT[k].n} kurmay haritası">
 <defs><radialGradient id="sea" cx=".5" cy=".45" r=".75"><stop offset="0" stop-color="#1b2a33"/><stop offset="1" stop-color="#0c1418"/></radialGradient>
 <linearGradient id="landg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a5236"/><stop offset="1" stop-color="#2f3524"/></linearGradient>
 <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#ffffff0c" stroke-width="2"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="2.2"/></filter></defs>
 <rect width="${W}" height="${H}" fill="url(#sea)"/>${g}
 <path d="${land}" fill="none" stroke="${acc}" stroke-width="5" opacity=".18" filter="url(#glow)"/>
 <path d="${land}" fill="url(#landg)" stroke="${acc}" stroke-width="1.1" stroke-linejoin="round"/>
 <path d="${land}" fill="url(#hatch)"/>
 ${NAT[k].cities.map(([n,la,lo,cap])=>{const[x,y]=f(lo,la);return cap?`<polygon points="${starPts(x,y,5.5)}" fill="${acc}" stroke="#000" stroke-width=".6"/><text x="${x+7}" y="${y+3}" font-size="9" font-weight="700" fill="#fff" font-family="Barlow Condensed,sans-serif" stroke="#000" stroke-width="2.4" paint-order="stroke">${esc(n)}</text>`:`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#eeeadb" stroke="#000" stroke-width=".8"/><text x="${x+5}" y="${y+3}" font-size="8" fill="#e8e4d4" font-family="Barlow Condensed,sans-serif" stroke="#000" stroke-width="2.2" paint-order="stroke">${esc(n)}</text>`}).join('')}
 ${extra}
 <g transform="translate(${W-26},26)"><circle r="14" fill="#00000066" stroke="#ffffff30"/><path d="M0 -12 L4 0 L0 -3 L-4 0Z" fill="${acc}"/><path d="M0 12 L4 0 L0 3 L-4 0Z" fill="#ffffff55"/><text y="-15.5" text-anchor="middle" font-size="7" fill="#fff" font-family="Barlow Condensed,sans-serif">K</text></g>
 <g transform="translate(12,${H-16})"><rect width="${bl.toFixed(1)}" height="4" fill="#eeeadb"/><rect width="${(bl/2).toFixed(1)}" height="4" fill="#00000088"/><text y="-3" font-size="7" fill="#fff" font-family="Barlow Condensed,sans-serif">${km} km</text></g>
 <text x="10" y="13" font-size="7.5" letter-spacing="1.5" fill="${acc}" font-family="Barlow Condensed,sans-serif" font-weight="700">GİZLİ · ${esc(NAT[k].n.toLocaleUpperCase('tr'))} KURMAY HARİTASI</text>
 </svg>`;
}

function fxPush(f){FXQ.push(f);if(!FXON)fxNext()}
function fxNext(){const f=FXQ.shift();if(!f){FXON=false;return}FXON=true;f(()=>{FXON=false;fxNext()})}
function fxLayer(html,cls){let el=$('#fx');if(!el){el=document.createElement('div');el.id='fx';document.body.appendChild(el)}el.className=cls||'';el.innerHTML=html;el.hidden=false;return el}
function fxClose(done){const el=$('#fx');if(el){el.classList.add('out');setTimeout(()=>{el.hidden=true;el.innerHTML='';el.className=''},380)}setTimeout(done,390)}

 {const A=pickPt();let best=null,bd=1e9;for(let y=0;y<RES;y+=2)for(let x=0;x<RES;x+=2)if(H2[y*RES+x]<WL){const px=x/(RES-1)*W,py=y/(RES-1)*Hh;const d=Math.hypot(px-A[0],py-A[1]);if(d<bd){bd=d;best=[px,py]}}
  tasks.push({t:'water',A,B:best||[W/2,Hh/2],ti:'Su kaynağı',tx:'Timin suyu bitti. A noktasına en yakın su kaynağını (mavi alan) işaretle.'})}
 let i=0,sc=0,wait=false;

 function show(){const tk=tasks[i];$('#mi').textContent=i+1;$('#bn').textContent=i+1;$('#bt').textContent=tk.ti;$('#bx').textContent=tk.tx;$('#fb').innerHTML='';base();if(tk.A)mark(tk.A[0],tk.A[1],'#ffffff','A')}
 cv.addEventListener('click',e=>{if(wait||!MG||MG.done)return;const r=cv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;const tk=tasks[i];let s=0,msg='';base();
  if(tk.A)mark(tk.A[0],tk.A[1],'#ffffff','A');
  if(tk.t==='grid'){const cx=Math.floor(x/KM),cy=Math.floor(y/KM);const d=Math.hypot(cx-tk.gx,cy-tk.gy);s=d===0?1:clamp(1-d/3.5);ctx.strokeStyle='#7fe07a';ctx.lineWidth=3;ctx.strokeRect(tk.gx*KM,tk.gy*KM,KM,KM);mark(x,y,'#ffd23a','Sen');msg=d===0?'Tam isabet.':`Hedef karenin ${d.toFixed(1)} kare uzağına işaretledin.`}
  if(tk.t==='peak'){const h=hAt(x/W,y/Hh);s=clamp((h-hmed)/(peak[2]-hmed));mark(peak[0],peak[1],'#7fe07a','Zirve '+elev(peak[2])+' m');mark(x,y,'#ffd23a',elev(h)+' m');msg=`İşaretlediğin nokta ${elev(h)} m, zirve ${elev(peak[2])} m.`}
  if(tk.t==='az'||tk.t==='water'){const err=Math.hypot(x-tk.B[0],y-tk.B[1])/KM;s=clamp(1-err/(tk.t==='az'?1.6:1.3));ctx.setLineDash([5,4]);ctx.strokeStyle='#7fe07a';ctx.beginPath();ctx.moveTo(tk.A[0],tk.A[1]);ctx.lineTo(tk.B[0],tk.B[1]);ctx.stroke();ctx.setLineDash([]);mark(tk.B[0],tk.B[1],'#7fe07a',tk.t==='az'?'Varış':'Su');mark(x,y,'#ffd23a','Sen');msg=`Hata ${err.toFixed(2).replace('.',',')} km.`}
  sc+=s/4;$('#mp').textContent=Math.round(sc*100);wait=true;
  $('#fb').innerHTML=`<div class="brief" style="margin-top:10px"><span class="n" style="color:${s>=.6?'var(--green)':s>=.35?'var(--amber)':'var(--red)'}">${Math.round(s*100)}</span><div><b>${s>=.85?'Mükemmel':s>=.6?'İyi':s>=.35?'Orta':'Zayıf'}</b><span class="small">${esc(msg)}</span></div></div><button class="btn block" id="nx" style="margin-top:10px">${i<3?'Sonraki görev':'Değerlendirmeyi gör'}</button>`;
  $('#nx').addEventListener('click',()=>{wait=false;i++;if(i>=4)return mgEnd(sc);show()})});
 show();
}

function mgLead(){
 const nm=SQN[S.nation]||SQN.TR;const names=nm.slice().sort(()=>R()-.5).slice(0,4);
 const sq=names.map((n,i)=>({n,m:52+Math.round(R()*20),look:{g:R()<.2?'k':'e',skin:Math.floor(R()*5),hs:pick(['asker','kisa','kel']),hc:Math.floor(R()*4),beard:pick(['yok','yok','kirli','biyik']),eye:Math.floor(R()*4),boy:175,kilo:70+Math.round(R()*20),hat:true}}));
 sq.forEach(s=>{if(s.look.g==='k'){s.look.hs='topuz';s.look.beard='yok'}});
 let coh=50,i=0;const sit=LEADS.slice().sort(()=>R()-.5).slice(0,4);const lb=.8+S.st.lider/250;let bub={};
 const box=$('#mgb');const br=B();
 function draw(cur,fb=''){box.innerHTML=`<div class="mg-hud"><span>Durum <b>${Math.min(i+1,4)}</b>/4</span><span>Tim bütünlüğü <b>${Math.round(coh)}</b></span></div>
  <div class="card" style="padding:12px"><div class="squad">${sq.map((s,j)=>`<div class="sq ${cur&&(cur.t===j||cur.m===j)?'tgt':''}">${bub[j]?`<span class="bubble">${esc(bub[j])}</span>`:''}${avatar(80,br,Math.max(0,S.rank-3),s.look,S.nation,s.n)}<b>${esc(s.n)}</b><div class="mb"><i style="width:${s.m}%;background:${s.m<35?'var(--red)':s.m<60?'var(--amber)':'var(--green)'}"></i></div></div>`).join('')}</div>
  <div class="bar" style="margin-top:4px"><span>Tim bütünlüğü</span><div class="t"><i style="width:${coh}%"></i></div><span class="v">${Math.round(coh)}</span></div></div>${fb}`}
 function ask(){if(i>=4){const avg=sq.reduce((a,s)=>a+s.m,0)/4;return mgEnd(clamp((avg*.5+coh*.5-35)/50),`<p class="small">Ortalama moral ${Math.round(avg)} · Tim bütünlüğü ${Math.round(coh)}</p>`)}
  const s=sit[i];const t=Math.floor(R()*4);let m=(t+1+Math.floor(R()*3))%4;const cur={t,m};const tx=s.tx.replace('{n}',sq[t].n).replace('{m}',sq[m].n);
  const opts=s.o.map((o,k)=>[o,k]).sort(()=>R()-.5);bub={};
  draw(cur,`<div class="brief"><span class="n">${i+1}</span><div><b>Durum</b><span class="small">${esc(tx)}</span></div></div>${opts.map(([o,k])=>`<button class="opt" data-k="${k}"><span class="k">${'ABC'[opts.findIndex(x=>x[1]===k)]}</span><span class="grow">${esc(o[0])}</span></button>`).join('')}`);
  box.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{const o=s.o[+b.dataset.k];const e=o[1];const pos=v=>v>0?v*lb:v;
   if(e.t!=null){sq[t].m=clamp(sq[t].m+pos(e.t));bub[t]=o[2]}if(e.m!=null)sq[m].m=clamp(sq[m].m+pos(e.m));if(e.a)sq.forEach(q=>q.m=clamp(q.m+pos(e.a)));if(e.a&&e.t==null)bub[Math.floor(R()*4)]=o[2];
   coh=clamp(coh+pos(e.c||0));if(e.tr)S.trust=clamp(S.trust+e.tr);
   const good=(e.c||0)>=8;i++;draw(cur,`<div class="brief"><span class="n" style="color:${good?'var(--green)':(e.c||0)<0?'var(--red)':'var(--amber)'}">${(e.c||0)>0?'+':''}${Math.round(pos(e.c||0))}</span><div><b>${good?'İyi liderlik':(e.c||0)<0?'Tim güveni sarsıldı':'İdare eder'}</b><span class="small">${esc(o[0])}</span></div></div><button class="btn block" id="nx">${i<4?'Sonraki durum':'Değerlendirmeyi gör'}</button>`);
   $('#nx').addEventListener('click',ask)}))}
 ask();
}

  for(let i=0;i<grid.length;i++)if(grid[i])s+=`<rect x="${(i%N)*C}" y="${Math.floor(i/N)*C}" width="${C}" height="${C}" fill="${cols[grid[i]]}"/>`}
 else{for(let k=1;k<4;k++){for(let b=0;b<11;b++){const cx=rr()*W,cy=rr()*W,r=26+rr()*48,n=7+Math.floor(rr()*4);const pts=[...Array(n)].map((_,j)=>{const a=j/n*Math.PI*2,rad=r*(.55+rr()*.7)*(j%2?1:1.25);return[Math.cos(a)*rad*(1.4),Math.sin(a)*rad*.8]});const rot=rr()*Math.PI;
   const P=pts.map(([x,y])=>[x*Math.cos(rot)-y*Math.sin(rot),x*Math.sin(rot)+y*Math.cos(rot)]);let d='';for(let j=0;j<n;j++){const p0=P[j],p1=P[(j+1)%n];const mx=(p0[0]+p1[0])/2,my=(p0[1]+p1[1])/2;d+=(j?'':`M${((P[n-1][0]+p0[0])/2).toFixed(1)} ${((P[n-1][1]+p0[1])/2).toFixed(1)}`)+`Q${p0[0].toFixed(1)} ${p0[1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`}

 s+='</svg>';CAMOC[key]=`url("data:image/svg+xml;utf8,${encodeURIComponent(s)}")`;return CAMOC[key]}

/* ev: fiyat, haftalık gider, günlük ruh hali, toparlanma, statü */
const HOUSE=[['lojman','Kışla lojmanı',0,0,0,0,0,'Ücretsiz. Sade, kalabalık ve gürültülü.'],['kira','Kiralık daire',0,1200,1,5,1,'Kendi kapın, kendi düzenin. Haftalık kira.'],['daire','Kendi dairen',95000,250,2,8,3,'Tapu senin. Değeri zamanla artar; sadece aidat ödersin.'],['mustakil','Bahçeli müstakil ev',260000,500,3,12,6,'Bahçe, sessizlik ve evcil hayvanlar için alan.'],['villa','Deniz manzaralı villa',680000,1400,4,15,12,'Havuz, deniz ve gün batımı. Statünün zirvesi.']];
/* araç: fiyat, haftalık gider, izin günü +eylem, statü */
const CARS=[['sedan','İkinci el sedan',48000,400,1,1,'Toplu taşımaya veda. İzin günlerinde +1 eylem.'],['suv','Yeni arazi aracı',145000,900,1,4,'Her yola çıkar. İzin günlerinde +1 eylem, buluşmalarda +bağlılık.'],['spor','Spor otomobil',390000,1800,2,9,'Hız ve gösteriş. İzin günlerinde +2 eylem.']];
/* evcil: fiyat, haftalık mama/bakım, günlük ruh hali, gereken ev seviyesi */
const PETS=[['kedi','Kedi',3000,150,1,1,'Akşamları kapıda seni bekler. Ruh hali her gün +1.'],['kopek',()=>DOGB[S.nation]||'Çoban köpeği',7500,300,2,3,'Sadık yol arkadaşı. Ruh hali +2, sabah koşularıyla dayanıklılık artar.'],['at','Safkan at',65000,1600,2,4,'Hafta sonları binicilik. Ruh hali +2, dayanıklılık ve statü.']];
/* tatil: fiyat, gereken izin günü, ruh hali, yorgunluk */
const TRIPS=[[0,'dag',7000,1,15,40],[1,'sahil',20000,2,28,60],[2,'sehir',48000,3,40,70]];
const INV=[['mevduat','Vadeli mevduat','Düşük risk, sabit faiz.',0,.0009],['altin','Altın','Güvenli liman; savaşta değer kazanır.',.012,.0005],['savunma','Savunma sanayii hissesi','Yüksek risk. Savaşlar ve harekât başarıları fiyatı uçurur.',.026,.0011],['endeks','Borsa endeks fonu','Dengeli risk, uzun vadede büyür.',.016,.0008]];
const VT=[['ev','Ev'],['arac','Araç'],['evcil','Evcil hayvan'],['tatil','Tatil'],['yatirim','Yatırım']];

/* ---------- Durum ---------- */
function vS(){S.vl=S.vl||{ev:'lojman',car:null,pets:[],inv:{},mk:{altin:100,savunma:100,endeks:100},hist:{altin:[100],savunma:[100],endeks:[100]},hv:0,trips:0};if(PETS.r8!==S.nation){rebuildPets();PETS.r8=S.nation;migratePets(S.vl)}return S.vl}
const houseOf=()=>HOUSE.find(h=>h[0]===vS().ev)||HOUSE[0];
const carOf=()=>CARS.find(c=>c[0]===vS().car);
const houseLv=()=>HOUSE.findIndex(h=>h[0]===vS().ev);
function weeklyCost(){const v=vS();let c=houseOf()[3];const car=carOf();if(car)c+=car[3];v.pets.forEach(p=>{const P=PETS.find(x=>x[0]===p.t);if(P)c+=P[3]});return c}
function invValue(){const v=vS();let t=v.inv.mevduat||0;['altin','savunma','endeks'].forEach(k=>t+=(v.inv[k]||0)*v.mk[k]);return t}
function assetValue(){const v=vS();const h=houseOf();let t=h[2]?h[2]*(1+(v.hv||0)):0;const c=carOf();if(c)t+=c[2]*.65;return t+invValue()}
function statu(){const v=vS();let s=houseOf()[6];const c=carOf();if(c)s+=c[5];v.pets.forEach(p=>{if(p.t==='at')s+=3});return s+shopStatu()}
function petName(t){const n={TR:['Paşa','Karabaş','Zeytin','Tarçın','Duman'],ABD:['Max','Bella','Rocky','Luna','Scout'],RUS:['Barsik','Muhtar','Laika','Murka','Sharik']}[S.nation]||['Max','Luna','Rocky','Bella','Duman'];return pick(n)}

/* ---------- Günlük ve haftalık işleyiş ---------- */
function vDaily(notes){const v=vS();shopDaily();const h=houseOf();addSt('mental',h[4]*.5);S.fatigue=clamp(S.fatigue-h[5]*.5);
 v.pets.forEach(p=>{const P=PETS.find(x=>x[0]===p.t);if(!P)return;addSt('mental',P[4]*.5);if(P[7]==='kopek')addSt('dayan',.12);p.b=clamp((p.b||60)+(S.money>=0?.5:-3))});
 /* piyasa */
 const war=!!S.world.war;INV.slice(1).forEach(([k,,, vol,drift])=>{let ch=drift+(R()*2-1)*vol;if(k==='savunma'&&war)ch+=.006;if(k==='altin'&&war)ch+=.003;if(k==='savunma'&&S.mRes&&S.mRes.res===2)ch+=.002;v.mk[k]=Math.max(20,v.mk[k]*(1+ch));v.hist[k]=[...(v.hist[k]||[]),v.mk[k]].slice(-30)});
 if(v.inv.mevduat)v.inv.mevduat*=1+INV[0][4];if(houseOf()[2])v.hv=(v.hv||0)+.0004;
 if(S.money<0){addSt('mental',-3);notes.push(`<span class="red">Borçtasın (${money(S.money)}).</span> Faturalar birikiyor; ruh hali −3. Varlık sat ya da harcamaları kıs.`)}}
function vWeekly(notes){const c=weeklyCost();if(c){S.money-=c;notes.push(`Haftalık giderler: <b>−${money(c)}</b> (${[houseOf()[3]?houseOf()[1]+' '+money(houseOf()[3]):'',carOf()?'araç '+money(carOf()[3]):'',vS().pets.length?'evcil hayvan '+money(vS().pets.reduce((a,p)=>a+(PETS.find(x=>x[0]===p.t)||[0,0,0,0])[3],0)):''].filter(Boolean).join(', ')}).`)}}

/* ---------- Eylemler ---------- */
function vAct(v){const[a,id,arg]=v.split('|');const V=vS();
 const needIzin=()=>{if(false){toast('Satın almak için şehre inmen gerekiyor: izin gününü bekle.');return true}return false};
 if(a==='ev'){const h=HOUSE.find(x=>x[0]===id);if(!h||V.ev===id)return;if(needIzin())return;const cur=houseOf();const sell=cur[2]?Math.round(cur[2]*(1+(V.hv||0))*.92):0;const cost=h[2]-sell;
  if(h[2]&&S.money<cost)return toast(`Paran yetmiyor. Gereken: ${money(cost)} (eski evinin satışı dahil).`);
  pushModal({k:'Varlık · Ev',ti:h[1],art:ART[h[0]](),body:`<p>${esc(h[7])}</p><div class="fx">${h[2]?`<span>Fiyat ${money(h[2])}</span>`:''}${sell?`<span class="p">Eski evin satışı +${money(sell)}</span>`:''}${h[3]?`<span class="n">Haftalık ${money(h[3])}</span>`:''}<span class="p">Ruh hali +${h[4]}/gün</span><span class="p">Toparlanma +${h[5]}</span></div>`,ch:[{t:h[2]?'Satın al ve taşın':'Taşın',fn:()=>{S.money-=Math.max(0,cost);if(!h[2]&&sell)S.money+=sell;V.ev=id;V.hv=0;if(houseLv()<3)V.pets=V.pets.filter(p=>p.t==='kedi');addSt('mental',6);log('Yeni ev: '+h[1]);feed('ulusal',`${S.name} yeni evine taşındı`,`${myRank()} ${S.name}, ${h[1].toLocaleLowerCase('tr')} aldı.`,[S.nation]);save();render()}},{t:'Vazgeç',fn:()=>{}}]})}
 if(a==='car'){const c=CARS.find(x=>x[0]===id);if(!c)return;if(needIzin())return;const cur=carOf();const sell=cur?Math.round(cur[2]*.65):0;const cost=c[2]-sell;if(S.money<cost)return toast(`Paran yetmiyor. Gereken: ${money(cost)}.`);
  pushModal({k:'Varlık · Araç',ti:c[1],art:ART[c[0]](),body:`<p>${esc(c[6])}</p><div class="fx"><span>Fiyat ${money(c[2])}</span>${sell?`<span class="p">Eski aracın +${money(sell)}</span>`:''}<span class="n">Haftalık yakıt ve sigorta ${money(c[3])}</span><span class="p">İzin günü +${c[4]} eylem</span></div>`,ch:[{t:'Anahtarı al',fn:()=>{S.money-=cost;V.car=id;addSt('mental',5);log('Yeni araç: '+c[1]);save();render()}},{t:'Vazgeç',fn:()=>{}}]})}
 if(a==='carsell'){const c=carOf();if(!c)return;S.money+=Math.round(c[2]*.65);V.car=null;toast('Aracını sattın: +'+money(Math.round(c[2]*.65)));save();render()}
 if(a==='pet'){return petBuy(id);const P=PETS.find(x=>x[0]===id);if(!P)return;if(needIzin())return;if(houseLv()<P[5])return toast(`${typeof P[1]==='function'?P[1]():P[1]} için en az ${HOUSE[P[5]][1].toLocaleLowerCase('tr')} gerekiyor.`);if(V.pets.some(p=>p.t===id))return toast('Zaten bir tane var.');if(S.money<P[2])return toast('Paran yetmiyor.');
  const nm=petName(id);S.money-=P[2];V.pets.push({t:id,n:nm,b:70,d:S.day});addSt('mental',8);log('Yeni dost: '+nm);pushModal({k:'Varlık · Evcil hayvan',ti:nm,art:ART[id](),body:`<p>${esc(typeof P[1]==='function'?P[1]():P[1])} artık evinde. Adını <b>${esc(nm)}</b> koydun.</p><div class="fx"><span class="p">Ruh hali +8</span><span class="n">Haftalık bakım ${money(P[3])}</span></div>`});save();render()}
 if(a==='trip'){const T_=TRIPS[+id];if(!T_)return;if(S.world.war)return toast('Savaş sürerken tatil yok.');if(!S.izin)return toast('Tatile ancak izin gününde çıkabilirsin.');const extra=T_[3]-1;if((S.leave||0)<extra)return toast(`Bu tatil ${T_[3]} gün sürüyor; ${extra} gün ödül iznin olmalı.`);if(S.money<T_[2])return toast('Paran yetmiyor.');
  S.money-=T_[2];S.leave=(S.leave||0)-extra;addSt('mental',T_[4]);S.fatigue=clamp(S.fatigue-T_[5]);addSt('saglik',3);V.trips++;if(S.partner){S.partner.aff=clamp(S.partner.aff+T_[3]*7);S.partner.last=S.day}const nm=(TRIP[S.nation]||TRIP.TR)[T_[0]];log('Tatil: '+nm);
  pushModal({k:'Tatil',ti:nm,art:ART[T_[1]](),body:`<p>${S.partner?esc(S.partner.name)+' ile ':''}${T_[3]} gün boyunca üniformayı unuttun. ${['Sabah sisli dağlarda yürüdün, akşam şöminenin başında kitap okudun.','Güneş, deniz ve uzun sohbetler. Telefonuna hiç bakmadın.','Müzeler, sokaklar, yeni tatlar. Dünyanın savaştan ibaret olmadığını hatırladın.'][T_[0]]}</p><div class="fx"><span class="p">Ruh hali +${T_[4]}</span><span class="p">Yorgunluk −${T_[5]}</span>${S.partner?`<span class="p">Bağlılık +${T_[3]*7}</span>`:''}${extra?`<span class="n">İzin −${extra} gün</span>`:''}</div>`});save();render()}
 if(a==='inv'){const k=id,amt=+arg;const I=INV.find(x=>x[0]===k);if(!I)return;
  if(amt>0){if(S.money<amt)return toast('Bu kadar nakdin yok.');S.money-=amt;if(k==='mevduat')V.inv.mevduat=(V.inv.mevduat||0)+amt;else V.inv[k]=(V.inv[k]||0)+amt/V.mk[k];toast(`${I[1]}: ${money(amt)} yatırıldı.`)}
  else{const val=k==='mevduat'?(V.inv.mevduat||0):(V.inv[k]||0)*V.mk[k];if(val<=0)return;const take=amt===0?val:Math.min(val,-amt);S.money+=take;if(k==='mevduat')V.inv.mevduat=val-take;else V.inv[k]=(val-take)/V.mk[k];toast(`${I[1]}: ${money(take)} nakde çevrildi.`)}
  save();render()}}

/* ---------- Ekran ---------- */
function spark(a,col){if(!a||a.length<2)return'';const mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1;return `<svg viewBox="0 0 100 26" class="spark" preserveAspectRatio="none"><path d="${a.map((v,i)=>(i?'L':'M')+(i/(a.length-1)*100).toFixed(1)+' '+(24-(v-mn)/r*22).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="1.6"/></svg>`}

 const head=`<div class="card hero wallet"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="lbl">Cüzdan</div><div class="wl-m num ${S.money<0?'red':''}">${money(S.money)}</div><span class="small muted">Sonraki maaş ${nd===7?'bugün gece':nd+' gün sonra'}</span></div><div style="text-align:right"><div class="lbl">Statü</div><div class="wl-s">${'★'.repeat(Math.min(5,Math.ceil(statu()/5)))}<span>${'★'.repeat(5-Math.min(5,Math.ceil(statu()/5)))}</span></div></div></div>

const DEEP=['hvt','kopru','radar','ihaussu','kesif','csar','liman','havaalani'];
function threatInfo(){const me=S.nation,N=NAT[me];const W=S.world;
 const en=W.war||NK.filter(k=>k!==me&&!allied(me,k)).sort((a,b)=>rel(me,a)-rel(me,b))[Math.floor(R()*Math.min(3,NK.length-1))]||NK.find(k=>k!==me);
 const al=NK.filter(k=>k!==me&&allied(me,k));S.citySeen=S.citySeen||[];
 const pickCity=(nat)=>{const C=NAT[nat].cities.filter(c=>!S.citySeen.includes(c[0]));return pick(C.length?C:NAT[nat].cities)};
 const th=pick(N.thr);let cn=me,city,saha='yurtici';
 const r=R();
 if(T()>=1&&al.length&&r<.18){cn=pick(al);city=pickCity(cn);saha='muttefik'}
 else if(T()>=2&&r<.33){cn=en;city=pickCity(cn);saha='dusman'}
 else{const near=N.cities.slice().sort((a,b)=>hav([a[2],a[1]],[th[2],th[1]])-hav([b[2],b[1]],[th[2],th[1]])).filter(c=>!S.citySeen.includes(c[0]));city=pick((near.length?near:N.cities).slice(0,4))}
 S.citySeen=[...S.citySeen,city[0]].slice(-5);
 return{en,th:saha==='yurtici'?th:[NAT[cn].n+' içleri',city[1]+(R()-.5)*1.5,city[2]+(R()-.5)*1.5],city,al:al.length?pick(al):null,cn,saha}}

function mealOut(name,pref){S.mealOut=S.mealOut||{};const order=pref?[pref,...['k','o','a'].filter(x=>x!==pref)]:BRK.test(name)?['k','o','a']:['o','a','k'];const slot=order.find(k=>S.meals[k]==null);if(!slot)return null;S.meals[slot]=bestMeal(slot);S.mealOut[slot]=name;return slot}

 S.eat[i]=S.day;S.money-=f[2];addSt('mental',f[3]);S.nutri=clamp(S.nutri+f[4]);S.fatigue=clamp(S.fatigue-3);const slot=mealOut(f[0]);log(f[0]+'.');toast(f[1]+' Ruh hali +'+f[3]+(slot?` · ${MEALN[slot]} yapıldı`:''));if(R()<.3)setTimeout(meet,200);save();render()}

 S.plans.push({k,id:pid,d,n:who.n});log(`${who.n} ile plan: ${P.n} (${dayName(d)})`);if(!incoming)pushModal({k:'Plan',ti:who.n,body:`<p>"${esc(pick(['Harika fikir! Sabırsızlanıyorum.','Anlaştık, kaçırmam!','Tam ihtiyacım olan şey. Görüşürüz!']))}"</p><div class="fx"><span class="p">${esc(P.n)} · ${dayName(d)}</span></div>`});save();render()}

function speechEval(t){const s=t.toLocaleLowerCase('tr');const has=w=>s.includes(w);const cnt=L=>L.filter(has).length;
 const th=Object.keys(SPT).filter(k=>SPT[k][1].some(has));const m={};Object.keys(SPW).forEach(k=>m[k]=cnt(SPW[k]));const digits=/\d/.test(s);
 const P=S.pol;let d=.5;const why=[];
 d+=Math.min(3,th.length)*.8;if(th.length)why.push(['p','Değindiğin konular: '+th.map(k=>SPT[k][0]).join(', ')]);else why.push(['n','Somut bir konuya değinmedin']);
 const weak=P.ekon<50?'eko':P.guv<50?'guv':null;if(weak&&th.includes(weak)){d+=2;why.push(['p',`Halkın en çok merak ettiği konuya (${SPT[weak][0].toLocaleLowerCase('tr')}) değindin`])}else if(weak){d-=1;why.push(['n',`Gündemdeki ${SPT[weak][0].toLocaleLowerCase('tr')} sorununa değinmedin`])}
 if(m.umut){d+=Math.min(1.5,m.umut*.75);why.push(['p','Umut veren bir dil'])}
 if(m.soz||digits){d+=1.5;why.push(['p','Somut vaatler ve rakamlar'])}
 if(m.emp){d+=1;why.push(['p','Empati ve teşekkür'])}
 if(m.sert){d-=2.5*m.sert;why.push(['n','Sert ve tehditkâr ifadeler'])}
 if(m.bol){d-=1.5*m.bol;why.push(['n','Ayrıştırıcı bir dil'])}
 if(m.ego){d-=2;why.push(['n','Başarıyı kendine mal ettin'])}
 if(t.length<60){d-=1;why.push(['n','Çok kısa kaldı'])}else if(t.length>=120&&t.length<=480)d+=1;else if(t.length>480){d-=1;why.push(['n','Fazla uzun; dikkat dağıldı'])}
 const main=th[0]||null;if(main&&P.lastTh===main){d-=1;why.push(['n','Aynı konuyu tekrar ettin'])}
 d=clamp(Math.round(d+(R()*2-1)),-7,8);
 const seg=SEG.map(([n,ks])=>{let v=d/3+ks.filter(k=>th.includes(k)).length*1.5-(n==='Muhalefet'?1.5:0)-(m.sert&&n!=='Güvenlik çevreleri'?1:0)+(m.sert&&n==='Güvenlik çevreleri'?.5:0);return[n,Math.round(clamp(50+v*6,5,95))]});
 return{d,th,m,why,main,seg}}

function pickPress(E){const P=S.pol;P.pqSeen=P.pqSeen||[];const free=PQ.map((_,i)=>i).filter(i=>!P.pqSeen.includes(i));const pool=free.length>=6?free:PQ.map((_,i)=>i);const out=[];
 const take=f=>{const c=pool.filter(i=>!out.includes(i)&&f(PQ[i]));if(c.length)out.push(pick(c))};
 if(E.d<0)take(q=>q.k==='neg');else if(E.d>=5)take(q=>q.k==='pos');
 if(E.main)take(q=>q.k===E.main);
 const weak=P.ekon<P.guv?'eko':'guv';take(q=>q.k===weak);
 while(out.length<3)take(q=>q.k!=='neg'&&q.k!=='pos');
 P.pqSeen=[...P.pqSeen,...out].slice(-10);return out.slice(0,3)}

function pressNext(){const P=S.pol,R_=P&&P.press;if(!R_)return;if(R_.i>=R_.qs.length)return pressEnd();
 const Qd=PQ[R_.qs[R_.i]];const ord=[0,1,2].sort(()=>R()-.5);const who=fname()+' · '+pick(PRS);

function pressAns(j){const P=S.pol,R_=P.press;const Qd=PQ[R_.qs[R_.i]];const a=Qd.a[j];const v=a[1]+(R()<.25?(R()<.5?-1:1):0);R_.sum+=v;P.onay=clamp(P.onay+v);const e=a[2]||{};if(e.ekon)P.ekon=clamp(P.ekon+e.ekon);if(e.guv)P.guv=clamp(P.guv+e.guv);
 R_.log=R_.log||[];R_.log.push([Qd.q,a[0],v]);R_.i++;save();
 const r=v>=3?['Salonda başlar sallandı','Net ve güven veren bir cevap.']:v>=1?['Kabul gören bir cevap','Muhabir not alıp bir sonraki soruya geçti.']:v===0?['Kaçamak bulundu','Salonda kısa bir sessizlik oldu.']:['Salon karıştı','Cevabın sosyal medyada hızla yayılıyor.'];
 toast(`${r[0]} · onay ${v>=0?'+':''}${v}`);setTimeout(pressNext,0)}

function pressEnd(){const P=S.pol,R_=P.press;P.press=null;const s=R_.sum;
 const ti=s>=7?'Basın toplantısı damga vurdu':s>=3?'Basın toplantısı olumlu geçti':s>=0?'Basın toplantısı dengede kaldı':'Basın toplantısı aleyhine döndü';
 feed('ulusal',`${S.name} basın toplantısı: ${ti.replace('Basın toplantısı ','')}`,R_.log.map(l=>'Soru: '+l[0]).slice(0,1).join(''),[S.nation]);
